<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ReFyn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #1C3334;
            --bg-mid: #2F4454;
            --bg-glass: rgba(255, 255, 255, 0.06);
            --text-primary: #f0ebe3;
            --text-secondary: rgba(240, 235, 227, 0.65);
            --text-muted: rgba(240, 235, 227, 0.4);
            --accent-green: #DA7B93;
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-hover: rgba(255, 255, 255, 0.15);
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Background (same as landing) ── */
        .hero-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background:
                linear-gradient(to bottom, rgba(28,51,52,0.4) 0%, rgba(28,51,52,0.5) 70%, var(--bg-deep) 100%),
                url('/images/hero-abstract.svg') center 40% / cover no-repeat;
            z-index: 0; pointer-events: none;
        }
        .hero-glow {
            position: fixed; top: -20%; left: 50%; transform: translateX(-50%);
            width: 800px; height: 500px;
            background: radial-gradient(circle, rgba(218,123,147,0.12) 0%, transparent 70%);
            pointer-events: none; filter: blur(80px); z-index: 0;
        }

        /* ── Navbar (identical to landing) ── */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5vw;
            background: rgba(28, 51, 52, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
        }
        .nav-logo {
            font-family: var(--font-heading);
            font-size: 1.4rem; font-weight: 700; font-style: italic;
            color: var(--text-primary);
            text-decoration: none; letter-spacing: -0.02em;
        }
        .nav-links { display: flex; gap: 32px; align-items: center; }
        .nav-links a {
            text-decoration: none; color: var(--text-secondary);
            font-size: 0.9rem; font-weight: 500; transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--text-primary); }
        .btn-nav {
            background: var(--accent-green); color: var(--bg-deep) !important;
            padding: 10px 22px; border-radius: 100px; font-weight: 600; font-size: 0.85rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-nav:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(218, 123, 147, 0.25);
        }
        @media (max-width: 768px) { .nav-links { display: none; } }

        /* ── Main Content ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .header-text {
            text-align: center;
            margin-bottom: 32px;
        }
        .header-text h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 700;
            font-style: italic;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }
        .header-text p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* ── Glassmorphism Card (compact + floating) ── */
        .auth-card {
            background: rgba(28, 51, 52, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.5),
                0 15px 35px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            animation: cardFloat 6s ease-in-out infinite;
            /* 3D tilt */
            --rotate-x: 0deg;
            --rotate-y: 0deg;
            --glare-x: 50%;
            --glare-y: 50%;
            transform: perspective(1200px) rotateX(var(--rotate-x)) rotateY(var(--rotate-y));
            will-change: transform;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .auth-card:hover {
            box-shadow:
                0 50px 100px rgba(0, 0, 0, 0.6),
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(218, 123, 147, 0.08),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }
        /* Glare overlay */
        .auth-card::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at var(--glare-x) var(--glare-y), rgba(255,255,255,0.08) 0%, transparent 60%);
            mix-blend-mode: overlay;
            z-index: 10;
            border-radius: inherit;
        }
        @keyframes cardFloat {
            0%, 100% { transform: perspective(1200px) rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) translateY(0); }
            50% { transform: perspective(1200px) rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) translateY(-8px); }
        }

        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper svg {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-secondary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .clean-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 12px 14px 12px 40px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .clean-input:focus {
            border-color: var(--accent-green);
        }
        .clean-input::placeholder { color: var(--text-muted); }

        .btn-submit {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-deep);
            border: none;
            padding: 13px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-style: italic;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-glass);
        }
        .divider::before { margin-right: .6em; }
        .divider::after { margin-left: .6em; }

        .social-login {
            display: flex;
            gap: 12px;
        }
        .btn-social {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-social:hover { background: rgba(255,255,255,0.05); border-color: var(--border-glass-hover); }

        .auth-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }
        .auth-footer a {
            color: var(--accent-green);
            text-decoration: underline;
            font-weight: 500;
        }

        .error-badge {
            display: none;
            background: rgba(147, 0, 10, 0.15);
            color: #ffb4ab;
            border: 1px solid rgba(255, 180, 171, 0.3);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="hero-bg"></div>
    <div class="hero-glow"></div>

    <nav class="navbar">
        <a href="/" class="nav-logo">ReFyn</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/#features">Features</a>
            <a href="/#roadmap">Workflow</a>
            <a href="/login">Sign In</a>
            <a href="/register" class="btn-nav">Get Started</a>
        </div>
    </nav>

    <main>
        <div class="header-text">
            <h1>Join ReFyn</h1>
            <p>Join us to access precision data tools.</p>
        </div>

        <div class="auth-card">
            <div id="error-message" class="error-badge">User already exists.</div>

            <form id="signup-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="username" class="clean-input" placeholder="Jane Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" class="clean-input" placeholder="jane@refyn.io" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="password" class="clean-input" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    CREATE ACCOUNT <span>&rarr;</span>
                </button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-login">
                <button type="button" class="btn-social">
                    <svg width="14" height="14" viewBox="0 0 48 48"><path d="M44.5 20H24v8.5h11.7C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    Google
                </button>
                <button type="button" class="btn-social">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                    GitHub
                </button>
            </div>
        </div>

        <div class="auth-footer">
            Already have an account? <a href="/login">Log in securely</a>
        </div>
    </main>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBadge = document.getElementById('error-message');
            const submitBtn = this.querySelector('.btn-submit');

            errorBadge.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Creating account... <span>&rarr;</span>';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }),
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorBadge.textContent = data.error || 'Registration failed.';
                    errorBadge.style.display = 'block';
                }
            } catch (err) {
                errorBadge.textContent = 'Connection error. Please try again.';
                errorBadge.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'CREATE ACCOUNT <span>&rarr;</span>';
            }
        });

        // If already authenticated, redirect to dashboard
        fetch('/api/auth/check').then(r => {
            if (r.ok) window.location.href = '/dashboard';
        });
    </script>
    <script>
        // 3D Tilt interaction for the auth card
        const card = document.querySelector('.auth-card');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateY = ((x - centerX) / centerX) * 6;
            const rotateX = ((centerY - y) / centerY) * 6;
            card.style.setProperty('--rotate-x', rotateX + 'deg');
            card.style.setProperty('--rotate-y', rotateY + 'deg');
            card.style.setProperty('--glare-x', (x / rect.width * 100) + '%');
            card.style.setProperty('--glare-y', (y / rect.height * 100) + '%');
            card.style.animation = 'none';
        });
        card.addEventListener('mouseleave', () => {
            card.style.setProperty('--rotate-x', '0deg');
            card.style.setProperty('--rotate-y', '0deg');
            card.style.setProperty('--glare-x', '50%');
            card.style.setProperty('--glare-y', '50%');
            card.style.animation = 'cardFloat 6s ease-in-out infinite';
        });
    </script>
</body>
</html>
