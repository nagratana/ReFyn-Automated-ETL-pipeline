services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: refyn
      POSTGRES_PASSWORD: refyn_pass
      POSTGRES_DB: refyn_data
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refyn -d refyn_data"]
      interval: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.10.2
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://refyn:refyn_pass@postgres:5432/airflow_meta
      # ETL database connection (used by DAGs via db_connection.py)
      POSTGRES_USER: refyn
      POSTGRES_PASSWORD: refyn_pass
      POSTGRES_DB: refyn_data
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install pandas psycopg2-binary SQLAlchemy &&
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
    volumes: &airflow-volumes
      - ./airflow_docker/dags:/opt/airflow/dags
      - ./airflow_docker/logs:/opt/airflow/logs
      - ./airflow_docker/plugins:/opt/airflow/plugins
      - ./:/opt/project
      - ./data/uploads:/opt/project/data/uploads
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.10.2
    environment: *airflow-env
    command: webserver
    ports:
      - "8085:8080"
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.10.2
    environment: *airflow-env
    command: scheduler
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
